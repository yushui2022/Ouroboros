[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros"
version = "0.1.0"
description = "Model dialect adaptive evolution control plane"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ouroboros contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
pydantic = ["pydantic-ai>=0.1"]

[project.scripts]
ouroboros = "ouroboros.cli:main"

[tool.setuptools.packages.find]
include = ["ouroboros*", "benchmarks*"]
